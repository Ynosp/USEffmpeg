<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USEffmpeg - 線上影片轉檔與處理系統</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 850px;
      background: var(--card-bg);
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }

    header {
      margin-bottom: 24px;
    }

    h1 {
      color: var(--primary-color);
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .status-bar {
      padding: 14px 20px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      color: #1e40af;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
    }

    .btn-primary {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .upload-box {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 48px 20px;
      text-align: center;
      background: #fafafa;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .upload-box:hover {
      border-color: var(--primary-color);
      background-color: #f0fdf4;
    }

    .upload-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #334155;
    }

    .upload-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 標頭資訊 -->
    <header>
      <h1>USEffmpeg 線上影片轉檔系統</h1>
      <p class="subtitle">100% 瀏覽器端 WebAssembly 處理 · 數據完全隱私不寫入伺服器</p>
    </header>

    <!-- FFmpeg 載入狀態條 -->
    <div class="status-bar" id="status-bar">
      <span id="status-text">FFmpeg 未載入 - 請點擊右側按鈕開始</span>
      <button class="btn-primary" id="load-btn">載入 FFmpeg 核心 (~31 MB)</button>
    </div>

    <!-- 檔案拖放上傳區 -->
    <main>
      <div class="upload-box" id="drop-zone" onclick="document.getElementById('file-input').click()">
        <div class="upload-title">點擊選擇或將影片檔案拖放至此處</div>
        <div class="upload-desc">支援格式：MP4, WebM, MOV, AVI, MKV, GIF, MP3, WAV 等</div>
        <input type="file" id="file-input" style="display:none;" accept="video/*,audio/*">
      </div>
    </main>
  </div>

</body>
</html>
