<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <!-- 自動解鎖 SharedArrayBuffer 權限 (必須引用本機 coi-serviceworker.js) -->
  <script src="coi-serviceworker.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ffmpeg webCLI 線上影音轉檔</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #0f111a;
      --card-bg: #161926;
      --card-hover: #1f2436;
      --border-color: #2a2e45;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      padding: 24px;
      line-height: 1.5;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .logo-area { display: flex; align-items: center; gap: 12px; }
    .logo-title { font-size: 1.25rem; font-weight: 700; }
    .badge {
      font-size: 0.75rem; padding: 2px 8px; border-radius: 12px;
      background-color: #1e293b; color: #60a5fa; border: 1px solid #334155;
    }
    .badge-green { background-color: #064e3b; color: #34d399; border-color: #065f46; }

    /* Status Bar */
    .status-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .btn {
      background-color: var(--accent-blue);
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { cursor: not-allowed; opacity: 0.8; }

    /* Upload Zone */
    .upload-zone {
      background-color: var(--card-bg);
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      padding: 30px 20px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 24px;
      transition: border-color 0.2s;
    }
    .upload-zone:hover { border-color: var(--accent-blue); }
    .file-input { display: none; }

    /* Operations Grid (原本的多功能面板) */
    .section-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 16px; }
    .grid-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .op-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .op-card:hover { background-color: var(--card-hover); border-color: var(--accent-blue); }
    .op-card i { font-size: 1.8rem; margin-bottom: 8px; color: var(--accent-blue); }
    .op-card span { display: block; font-size: 0.85rem; font-weight: 500; }

    /* Log Box */
    .log-box {
      background-color: #090a0f;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      font-family: monospace;
      font-size: 0.85rem;
      height: 150px;
      overflow-y: auto;
      color: #a7f3d0;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-area">
        <span class="logo-title">📹 ffmpeg webCLI 線上影音轉檔</span>
        <span class="badge">離線優先</span>
        <span class="badge badge-green">🔒 100% 本地處理，資料絕不上傳伺服器</span>
      </div>
      <a href="https://github.com/Ynosp/USEffmpeg" target="_blank" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">GitHub 專案</a>
    </header>

    <!-- 載入狀態與按鈕 -->
    <div class="status-card">
      <div id="logCurrentText">🔴 FFmpeg 尚未載入 - 點擊「載入 FFmpeg」開始使用</div>
      <button class="btn" onclick="loadFFmpeg()">▶ 載入 FFmpeg (~31 MB)</button>
    </div>

    <!-- 上傳區 -->
    <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
      <p id="uploadPrompt" style="font-size: 1.1rem; font-weight: 500; margin-bottom: 8px;">📁 點擊選取影片，或將影片檔案直接拖曳至此處</p>
      <p style="color: var(--text-muted); font-size: 0.85rem;">支援 MP4, MOV, AVI, MKV, MP3, WAV 等常見格式</p>
      <input type="file" id="fileInput" class="file-input" accept="video/*,audio/*">
    </div>

    <!-- 多功能選擇面板 (Operations) -->
    <div class="section-title">功能選擇 (OPERATIONS)</div>
    <div class="grid-panel">
      <div class="op-card" onclick="runOperation('convert')">
        <i class="fa-solid fa-arrows-rotate"></i>
        <span>格式轉換</span>
      </div>
      <div class="op-card" onclick="runOperation('extract_audio')">
        <i class="fa-solid fa-music"></i>
        <span>提取音訊</span>
      </div>
      <div class="op-card" onclick="runOperation('remove_audio')">
        <i class="fa-solid fa-volume-xmark"></i>
        <span>消除聲音</span>
      </div>
      <div class="op-card" onclick="runOperation('compress')">
        <i class="fa-solid fa-file-video"></i>
        <span>影片壓縮</span>
      </div>
      <div class="op-card" onclick="runOperation('gif')">
        <i class="fa-solid fa-image"></i>
        <span>轉為 GIF</span>
      </div>
    </div>

    <!-- 執行日誌 -->
    <div class="section-title">執行日誌 (Terminal Output)</div>
    <div class="log-box" id="logBox">> 系統已就緒，等待載入 FFmpeg 核心...</div>
  </div>

  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>

  <script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    let ffmpeg = null;
    let currentFile = null;

    function log(msg) {
      const logBox = document.getElementById("logBox");
      if (logBox) {
        logBox.innerText += "\n> " + msg;
        logBox.scrollTop = logBox.scrollHeight;
      }
      console.log(msg);
    }

    // 載入核心
    async function loadFFmpeg() {
      const btn = document.querySelector("button[onclick*='loadFFmpeg']");
      const statusText = document.getElementById("logCurrentText");

      try {
        if (btn) { btn.innerText = "⏳ 載入核心中..."; btn.disabled = true; }
        if (statusText) statusText.innerText = "正在下載 FFmpeg 模組 (~31 MB)...";
        log("下載 FFmpeg 模組中...");

        ffmpeg = createFFmpeg({ log: true });
        ffmpeg.setLogger(({ message }) => log(`[FFmpeg] ${message}`));

        await ffmpeg.load();

        if (statusText) statusText.innerHTML = "<span style='color: #34d399;'>🟢 FFmpeg 已就緒，請上傳影片並選擇功能！</span>";
        if (btn) {
          btn.innerText = "✅ FFmpeg 已成功載入";
          btn.style.backgroundColor = "#10b981";
          btn.disabled = true;
        }
        log("FFmpeg 核心成功載入！");
      } catch (err) {
        if (statusText) statusText.innerText = "載入失敗：" + err.message;
        if (btn) { btn.innerText = "❌ 載入失敗，點擊重試"; btn.disabled = false; }
        alert("FFmpeg 載入失敗：" + err.message);
      }
    }

    // 接收檔案
    function handleSelectedFiles(files) {
      if (!files || files.length === 0) return;
      currentFile = files[0];
      const uploadPrompt = document.getElementById("uploadPrompt");
      if (uploadPrompt) uploadPrompt.innerText = `📄 已選擇檔案：${currentFile.name} (${(currentFile.size / 1024 / 1024).toFixed(2)} MB)`;
      log(`載入檔案: ${currentFile.name}`);
    }

    // 執行各項功能
    async function runOperation(type) {
      if (!ffmpeg || !ffmpeg.isLoaded()) {
        alert("請先點擊上方「▶ 載入 FFmpeg」按鈕！");
        return;
      }
      if (!currentFile) {
        alert("請先選擇或拖曳影片檔案上傳！");
        return;
      }

      try {
        const inputName = "input_" + currentFile.name;
        let outputName = "output";
        let args = [];

        log(`寫入暫存檔: ${inputName}`);
        ffmpeg.FS('writeFile', inputName, await fetchFile(currentFile));

        if (type === 'convert') {
          outputName += ".mp4";
          args = ['-i', inputName, '-c:v', 'libx264', '-c:a', 'aac', outputName];
        } else if (type === 'extract_audio') {
          outputName += ".mp3";
          args = ['-i', inputName, '-vn', '-acodec', 'libmp3lame', outputName];
        } else if (type === 'remove_audio') {
          outputName += ".mp4";
          args = ['-i', inputName, '-an', '-vcodec', 'copy', outputName];
        } else if (type === 'compress') {
          outputName += "_compressed.mp4";
          args = ['-i', inputName, '-vcodec', 'h264', '-crf', '28', outputName];
        } else if (type === 'gif') {
          outputName += ".gif";
          args = ['-i', inputName, '-vf', 'fps=10,scale=320:-1:flags=lance', outputName];
        }

        log(`開始執行指令: ffmpeg ${args.join(' ')}`);
        await ffmpeg.run(...args);

        log("處理完成，準備下載...");
        const data = ffmpeg.FS('readFile', outputName);
        const blob = new Blob([data.buffer]);
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = outputName;
        a.click();
        log(`匯出成功: ${outputName}`);
      } catch (err) {
        alert("執行失敗: " + err.message);
        log("錯誤: " + err.message);
      }
    }

    // 事件監聽
    document.addEventListener("DOMContentLoaded", () => {
      const fileInput = document.getElementById('fileInput');
      if (fileInput) fileInput.addEventListener("change", (e) => handleSelectedFiles(e.target.files));
      window.addEventListener("dragover", (e) => e.preventDefault());
      window.addEventListener("drop", (e) => {
        e.preventDefault();
        if (e.dataTransfer && e.dataTransfer.files.length > 0) handleSelectedFiles(e.dataTransfer.files);
      });
    });
  </script>
</body>
</html>
