<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <!-- 載入 coi-serviceworker 解決 GitHub Pages 的 SharedArrayBuffer / COOP / COEP 跨域阻擋問題 -->
  <script src="coi-serviceworker.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ffmpeg webCLI 線上影音轉檔</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Tejaswi Gowda ffmpeg-webCLI 原版樣式 */
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --accent-blue: #1f6feb;
      --accent-green: #238636;
      --accent-green-bright: #2ea043;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      padding: 24px;
      line-height: 1.5;
    }

    .container { max-width: 1000px; margin: 0 auto; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .logo-area { display: flex; align-items: center; gap: 10px; }
    .logo-title { font-size: 1.2rem; font-weight: 700; color: #f0f6fc; }
    .badge {
      font-size: 0.75rem; padding: 2px 8px; border-radius: 12px;
      background-color: #1f242c; color: #58a6ff; border: 1px solid #30363d;
    }
    .badge-green { background-color: #0d2d1a; color: #3fb950; border-color: #1b4b27; }

    .status-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .status-text { font-size: 0.95rem; color: #f0f6fc; }

    .btn {
      background-color: var(--accent-blue);
      color: #ffffff;
      border: 1px solid rgba(240,246,252,0.1);
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { cursor: not-allowed; opacity: 0.85; }

    .upload-zone {
      background-color: var(--card-bg);
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      padding: 32px 20px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 24px;
      transition: border-color 0.2s;
    }
    .upload-zone:hover { border-color: var(--accent-blue); }
    .file-input { display: none; }

    .section-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 14px;
      color: #f0f6fc;
    }

    .grid-panel {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    @media (max-width: 850px) {
      .grid-panel { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 500px) {
      .grid-panel { grid-template-columns: repeat(2, 1fr); }
    }

    .op-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .op-card:hover { border-color: var(--accent-blue); background-color: #1c2129; }
    .op-card.active {
      border: 2px solid var(--accent-blue);
      background-color: #161f30;
      box-shadow: 0 0 8px rgba(31, 111, 235, 0.4);
    }
    .op-card i { font-size: 1.5rem; margin-bottom: 10px; color: #58a6ff; display: block; }
    .op-card span { font-size: 0.85rem; font-weight: 500; color: #c9d1d9; }

    .control-box {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .form-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 8px; font-size: 0.88rem; color: var(--text-muted); }
    select, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
    }
    select:focus, input:focus { border-color: var(--accent-blue); }

    .btn-submit {
      width: 100%;
      background-color: var(--accent-green-bright);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: background-color 0.2s;
    }
    .btn-submit:hover { background-color: #3fb950; }
    .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }

    .log-box {
      background-color: #040d06;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.85rem;
      height: 160px;
      overflow-y: auto;
      color: #3fb950;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header 區塊 -->
    <header>
      <div class="logo-area">
        <span class="logo-title">ffmpeg webCLI</span>
        <span class="badge">離線優先</span>
        <span class="badge badge-green">🔒 100% 本地端處理，檔案絕不上傳</span>
      </div>
      <a href="https://github.com/tejaswigowda/ffmpeg-webCLI" target="_blank" style="color: var(--text-muted); text-decoration: none; font-size: 0.85rem;">GitHub 專案</a>
    </header>

    <!-- 狀態卡片區塊 -->
    <div class="status-card">
      <div class="status-text" id="logCurrentText">🔴 FFmpeg 尚未載入 - 請點擊「載入 FFmpeg」開始</div>
      <button class="btn" id="loadBtn" onclick="loadFFmpeg()">▶ 載入 FFmpeg (~31 MB)</button>
    </div>

    <!-- 上傳/拖曳區塊 -->
    <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <p id="uploadPrompt" style="font-size: 1.05rem; font-weight: 500; margin-bottom: 6px; color: #f0f6fc;">📁 點擊選擇檔案，或將影音拖曳至此</p>
      <p style="color: var(--text-muted); font-size: 0.82rem;">支援 MP4, MOV, AVI, MKV, MP3, WAV 等常用格式</p>
      <input type="file" id="fileInput" class="file-input" accept="video/*,audio/*">
    </div>

    <!-- 功能選擇面板（原版 7 格卡片） -->
    <div class="section-title">功能選擇 (OPERATIONS)</div>
    <div class="grid-panel">
      <div class="op-card active" onclick="selectOp('convert', this)">
        <i class="fa-solid fa-rotate"></i>
        <span>格式轉換</span>
      </div>
      <div class="op-card" onclick="selectOp('extract_audio', this)">
        <i class="fa-solid fa-music"></i>
        <span>提取音訊</span>
      </div>
      <div class="op-card" onclick="selectOp('remove_audio', this)">
        <i class="fa-solid fa-volume-xmark"></i>
        <span>消除聲音</span>
      </div>
      <div class="op-card" onclick="selectOp('compress', this)">
        <i class="fa-solid fa-file-video"></i>
        <span>影片壓縮</span>
      </div>
      <div class="op-card" onclick="selectOp('gif', this)">
        <i class="fa-solid fa-image"></i>
        <span>轉為 GIF</span>
      </div>
      <div class="op-card" onclick="selectOp('rotate', this)">
        <i class="fa-solid fa-arrows-rotate"></i>
        <span>畫面旋轉</span>
      </div>
      <div class="op-card" onclick="selectOp('speed', this)">
        <i class="fa-solid fa-gauge-high"></i>
        <span>播放變速</span>
      </div>
    </div>

    <!-- 控制選單區塊 -->
    <div class="control-box">
      <div class="section-title" id="optTitle">⚙️ 格式轉換設定</div>
      <div id="optDynamicContent">
        <div class="form-group">
          <label>目標格式：</label>
          <select id="formatSelect">
            <option value="mp4">MP4</option>
            <option value="mkv">MKV</option>
            <option value="mov">MOV</option>
            <option value="webm">WebM</option>
          </select>
        </div>
      </div>
      <button class="btn-submit" id="execBtn" onclick="runCurrentOperation()">🚀 開始處理並下載</button>
    </div>

    <!-- 執行日誌區塊 -->
    <div class="section-title">執行日誌 (Terminal Output)</div>
    <div class="log-box" id="logBox">> 系統已就緒，等待載入 FFmpeg 核心...</div>
  </div>

  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>

  <script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    let ffmpeg = null;
    let currentFile = null;
    let currentOp = 'convert';

    function log(msg) {
      const logBox = document.getElementById("logBox");
      if (logBox) {
        logBox.innerText += "\n> " + msg;
        logBox.scrollTop = logBox.scrollHeight;
      }
      console.log(msg);
    }

    async function loadFFmpeg() {
      const btn = document.getElementById("loadBtn");
      const statusText = document.getElementById("logCurrentText");

      try {
        if (btn) { btn.innerText = "⏳ 載入核心中..."; btn.disabled = true; }
        if (statusText) statusText.innerText = "正在下載 FFmpeg WebAssembly 模組 (~31 MB)...";
        log("開始下載 FFmpeg WebAssembly 模組...");

        ffmpeg = createFFmpeg({ log: true });
        ffmpeg.setLogger(({ message }) => log(`[FFmpeg] ${message}`));

        await ffmpeg.load();

        if (statusText) statusText.innerHTML = "<span style='color: #34d399;'>🟢 FFmpeg 已就緒！請選擇或拖曳影片。</span>";
        if (btn) {
          btn.innerText = "✅ FFmpeg 已成功載入";
          btn.style.backgroundColor = "#238636";
          btn.disabled = true;
        }
        log("FFmpeg 核心成功載入！");
      } catch (err) {
        if (statusText) statusText.innerText = "載入失敗：" + err.message;
        if (btn) { btn.innerText = "❌ 點擊重試"; btn.disabled = false; }
        alert("FFmpeg 載入失敗：" + err.message);
      }
    }

    function selectOp(op, el) {
      currentOp = op;
      document.querySelectorAll('.op-card').forEach(card => card.classList.remove('active'));
      el.classList.add('active');

      const title = document.getElementById('optTitle');
      const content = document.getElementById('optDynamicContent');

      if (op === 'convert') {
        title.innerHTML = "⚙️ 格式轉換設定";
        content.innerHTML = `
          <div class="form-group"><label>目標格式：</label>
            <select id="formatSelect">
              <option value="mp4">MP4</option><option value="mkv">MKV</option><option value="mov">MOV</option><option value="webm">WebM</option>
            </select>
          </div>`;
      } else if (op === 'extract_audio') {
        title.innerHTML = "🎵 提取音訊設定";
        content.innerHTML = `
          <div class="form-group"><label>音訊格式：</label>
            <select id="audioFormatSelect">
              <option value="mp3">MP3</option><option value="aac">AAC</option><option value="wav">WAV</option>
            </select>
          </div>`;
      } else if (op === 'remove_audio') {
        title.innerHTML = "🔇 靜音設定";
        content.innerHTML = `<p style="color:var(--text-muted); font-size:0.88rem;">將會完全移除影片中的音軌。</p>`;
      } else if (op === 'compress') {
        title.innerHTML = "📉 影片壓縮設定";
        content.innerHTML = `
          <div class="form-group"><label>壓縮品質 (CRF)：</label>
            <select id="crfSelect">
              <option value="28">中度壓縮 (推薦)</option><option value="32">高度壓縮</option><option value="24">輕度壓縮</option>
            </select>
          </div>`;
      } else if (op === 'gif') {
        title.innerHTML = "🖼️ 轉為 GIF 設定";
        content.innerHTML = `
          <div class="form-group"><label>幀率 (FPS)：</label>
            <select id="gifFps"><option value="10">10 FPS</option><option value="15">15 FPS</option></select>
          </div>`;
      } else if (op === 'rotate') {
        title.innerHTML = "🔄 畫面旋轉設定";
        content.innerHTML = `
          <div class="form-group"><label>旋轉方向：</label>
            <select id="rotateSelect">
              <option value="1">順時針 90 度</option><option value="2">逆時針 90 度</option><option value="3">180 度翻轉</option>
            </select>
          </div>`;
      } else if (op === 'speed') {
        title.innerHTML = "⚡ 播放變速設定";
        content.innerHTML = `
          <div class="form-group"><label>播放倍率：</label>
            <select id="speedSelect">
              <option value="2.0">2.0x 快轉</option><option value="1.5">1.5x 快轉</option><option value="0.5">0.5x 慢動作</option>
            </select>
          </div>`;
      }
    }

    function handleSelectedFiles(files) {
      if (!files || files.length === 0) return;
      currentFile = files[0];
      const uploadPrompt = document.getElementById("uploadPrompt");
      if (uploadPrompt) {
        uploadPrompt.innerText = `📄 已載入檔案：${currentFile.name} (${(currentFile.size / 1024 / 1024).toFixed(2)} MB)`;
      }
      log(`已選擇檔案: ${currentFile.name}`);
    }

    async function runCurrentOperation() {
      if (!ffmpeg || !ffmpeg.isLoaded()) {
        alert("請先載入 FFmpeg！");
        return;
      }
      if (!currentFile) {
        alert("請先選擇影片檔案！");
        return;
      }

      const execBtn = document.getElementById('execBtn');
      execBtn.disabled = true;
      execBtn.innerText = "⏳ 處理中，請稍候...";

      try {
        const inputName = "input_" + currentFile.name;
        let outputName = "output";
        let args = [];

        log(`寫入虛擬檔案系統: ${inputName}`);
        ffmpeg.FS('writeFile', inputName, await fetchFile(currentFile));

        if (currentOp === 'convert') {
          const fmt = document.getElementById('formatSelect').value;
          outputName += "." + fmt;
          args = ['-i', inputName, outputName];
        } else if (currentOp === 'extract_audio') {
          const fmt = document.getElementById('audioFormatSelect').value;
          outputName += "." + fmt;
          args = ['-i', inputName, '-vn', outputName];
        } else if (currentOp === 'remove_audio') {
          outputName += ".mp4";
          args = ['-i', inputName, '-an', '-vcodec', 'copy', outputName];
        } else if (currentOp === 'compress') {
          const crf = document.getElementById('crfSelect').value;
          outputName += "_compressed.mp4";
          args = ['-i', inputName, '-vcodec', 'h264', '-crf', crf, outputName];
        } else if (currentOp === 'gif') {
          const fps = document.getElementById('gifFps').value;
          outputName += ".gif";
          args = ['-i', inputName, '-vf', `fps=${fps},scale=320:-1:flags=lance`, outputName];
        } else if (currentOp === 'rotate') {
          const rot = document.getElementById('rotateSelect').value;
          outputName += "_rotated.mp4";
          args = ['-i', inputName, '-vf', `transpose=${rot}`, outputName];
        } else if (currentOp === 'speed') {
          const spd = document.getElementById('speedSelect').value;
          outputName += "_speed.mp4";
          let pts = 1 / parseFloat(spd);
          args = ['-i', inputName, '-filter_complex', `[0:v]setpts=${pts}*PTS[v];[0:a]atempo=${spd}[a]`, '-map', '[v]', '-map', '[a]', outputName];
        }

        log(`執行指令: ffmpeg ${args.join(' ')}`);
        await ffmpeg.run(...args);

        log("處理完成，正在準備匯出下載...");
        const data = ffmpeg.FS('readFile', outputName);
        const blob = new Blob([data.buffer]);
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = outputName;
        a.click();
        log(`匯出成功: ${outputName}`);
      } catch (err) {
        alert("執行失敗: " + err.message);
        log("錯誤: " + err.message);
      } finally {
        execBtn.disabled = false;
        execBtn.innerText = "🚀 開始處理並下載";
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const fileInput = document.getElementById('fileInput');
      if (fileInput) fileInput.addEventListener("change", (e) => handleSelectedFiles(e.target.files));
      window.addEventListener("dragover", (e) => e.preventDefault());
      window.addEventListener("drop", (e) => {
        e.preventDefault();
        if (e.dataTransfer && e.dataTransfer.files.length > 0) handleSelectedFiles(e.dataTransfer.files);
      });
    });
  </script>
</body>
</html>
